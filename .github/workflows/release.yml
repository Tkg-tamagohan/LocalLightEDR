name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run with ephemeral test signing key (skip GitHub Release publish)'
        type: boolean
        required: true
        default: true
      tag:
        description: 'Release tag to validate (defaults to v<Cargo.toml version>)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve release parameters
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 - <<'EOF'
          import os
          import pathlib
          import sys
          import tomllib

          source_sha = os.environ.get("SOURCE_SHA", "").strip()
          if not source_sha:
              print("SOURCE_SHA is required", file=sys.stderr)
              sys.exit(1)

          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              dry_run = "true" if os.environ.get("INPUT_DRY_RUN", "true").lower() == "true" else "false"
              raw_tag = os.environ.get("INPUT_TAG", "").strip()
              if raw_tag:
                  tag = raw_tag
              else:
                  cargo = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
                  ver = cargo["workspace"]["package"]["version"]
                  tag = f"v{ver}"
          else:
              dry_run = "false"
              tag = os.environ["REF_NAME"].strip()

          if not tag.startswith("v"):
              print(f"Release tag must start with 'v': {tag!r}", file=sys.stderr)
              sys.exit(1)
          version = tag[1:]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"dry_run={dry_run}\n")
              fh.write(f"tag={tag}\n")
              fh.write(f"version={version}\n")
              fh.write(f"source_sha={source_sha}\n")
          print(f"Resolved release parameters: tag={tag}, version={version}, dry_run={dry_run}, source_sha={source_sha}")
          EOF
      - name: Compile and test release scripts
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          shopt -s nullglob
          py_files=(scripts/*.py)
          python3 -m py_compile "${py_files[@]}"
          python3 -m unittest scripts/test_release_scripts.py
      - name: Run release preflight checks
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          LEDR_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.LEDR_UPDATE_SIGNING_PRIVATE_KEY }}
          LEDR_UPDATE_SIGNING_KEY_ID: ${{ secrets.LEDR_UPDATE_SIGNING_KEY_ID }}
        run: |
          if [ "$DRY_RUN" = "false" ]; then
            if [ -z "${LEDR_UPDATE_SIGNING_PRIVATE_KEY:-}" ]; then
              echo "LEDR_UPDATE_SIGNING_PRIVATE_KEY secret is required for non-dry-run releases" >&2
              exit 1
            fi
            if ! git fetch --no-tags --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Release tag '${RELEASE_TAG}' does not exist on origin; refusing non-dry-run release." >&2
              exit 1
            fi
            TAG_COMMIT_SHA=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
            if [ "$TAG_COMMIT_SHA" != "$SOURCE_SHA" ]; then
              echo "Release tag '${RELEASE_TAG}' points to ${TAG_COMMIT_SHA}, expected source commit ${SOURCE_SHA}." >&2
              exit 1
            fi
            echo "Verified tag ${RELEASE_TAG} points to commit ${SOURCE_SHA}"
            python3 scripts/release_verify.py preflight \
              --expect-tag "$RELEASE_TAG" \
              --require-active-key \
              --private-key-env LEDR_UPDATE_SIGNING_PRIVATE_KEY
          else
            python3 scripts/release_verify.py preflight --expect-tag "$RELEASE_TAG"
          fi

  verify:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "win-x64-dev"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Rust workspace clippy and tests
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Chrome MV3 and Tauri UI Node unit tests
        shell: bash
        run: |
          shopt -s nullglob
          ext_tests=(extensions/ledr-chrome-mv3/tests/*.test.mjs)
          if [ "${#ext_tests[@]}" -eq 0 ]; then
            echo "No Chrome MV3 extension test files matched extensions/ledr-chrome-mv3/tests/*.test.mjs" >&2
            exit 1
          fi
          node --test "${ext_tests[@]}"
          required_ui_test="apps/ledr-ui/js-tests/phase4_ui.test.mjs"
          if [ ! -f "$required_ui_test" ]; then
            echo "Missing required UI test file: $required_ui_test" >&2
            exit 1
          fi
          ui_tests=(apps/ledr-ui/js-tests/*.test.mjs)
          if [ "${#ui_tests[@]}" -eq 0 ]; then
            echo "No UI test files matched apps/ledr-ui/js-tests/*.test.mjs" >&2
            exit 1
          fi
          node --test "${ui_tests[@]}"

  build:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "win-x64-release"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python release script unit tests (Windows)
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $pyFiles = @(Get-ChildItem scripts\*.py | Select-Object -ExpandProperty FullName)
          if ($pyFiles.Count -eq 0) {
            throw "No Python scripts matched scripts\*.py"
          }
          python -m py_compile $pyFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts/test_release_scripts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure NSIS (makensis) is installed
        shell: pwsh
        run: |
          $candidatePaths = if (-not [string]::IsNullOrWhiteSpace($env:LEDR_NSIS_CANDIDATE_PATHS)) {
            @($env:LEDR_NSIS_CANDIDATE_PATHS -split ';' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          }
          else {
            @(
              'C:\Program Files (x86)\NSIS\makensis.exe',
              'C:\Program Files\NSIS\makensis.exe'
            )
          }
          $retryDelaySeconds = if (-not [string]::IsNullOrWhiteSpace($env:LEDR_NSIS_RETRY_DELAY_SECONDS)) {
            [int]$env:LEDR_NSIS_RETRY_DELAY_SECONDS
          }
          else {
            10
          }

          function Resolve-MakeNsis {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Source -and (Test-Path -LiteralPath $cmd.Source)) {
              return $cmd.Source
            }
            foreach ($candidate in $candidatePaths) {
              if (Test-Path -LiteralPath $candidate) {
                return $candidate
              }
            }
            return $null
          }

          $makensisPath = Resolve-MakeNsis
          if (-not $makensisPath) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Installing NSIS via Chocolatey (attempt $attempt/3)..."
              choco install nsis -y --no-progress
              $chocoExit = $LASTEXITCODE
              $makensisPath = Resolve-MakeNsis
              if ($makensisPath) {
                break
              }
              Write-Warning "NSIS was not found after Chocolatey attempt $attempt (exit=$chocoExit)."
              if ($attempt -lt 3 -and $retryDelaySeconds -gt 0) {
                Start-Sleep -Seconds ($retryDelaySeconds * $attempt)
              }
            }
          }

          if (-not $makensisPath) {
            $wingetCmd = Get-Command winget -ErrorAction SilentlyContinue
            if ($wingetCmd) {
              Write-Host "Chocolatey NSIS install did not produce makensis.exe; trying winget fallback..."
              winget install --id NSIS.NSIS -e --silent --accept-package-agreements --accept-source-agreements
              $makensisPath = Resolve-MakeNsis
            }
          }

          if (-not $makensisPath) {
            Write-Error "makensis.exe was not found after NSIS installation attempts."
            exit 1
          }

          $makensisDir = Split-Path -Parent $makensisPath
          Add-Content -Path $env:GITHUB_PATH -Value $makensisDir
          if (-not (($env:PATH -split ';') -contains $makensisDir)) {
            $env:PATH = "$makensisDir;$env:PATH"
          }

          $nsisVersion = & $makensisPath /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis /VERSION failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Verified makensis at $makensisPath (version $nsisVersion)"
      - name: Build release binaries
        shell: pwsh
        run: |
          # Note: ledr-ui embeds packaging/update-public-keys.json at compile time via include_str!,
          # before dry-run ephemeral keys are generated. Therefore, in dry_run=true builds, the
          # compiled ledr-ui binary does not trust the ephemeral test key (dry_run validates
          # packaging, ephemeral signing, and verify-dist only).
          cargo build --release --locked -p ledr-daemon -p ledr-ui -p ledr-bridge-nm -p ledr-auth-helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile NSIS Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $stageDir = Join-Path $env:RUNNER_TEMP 'nsis-out'
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          $outFile = Join-Path $stageDir "LocalEDR-Setup-$($env:RELEASE_TAG)-win-x64.exe"
          & makensis "/DVERSION=$($env:RELEASE_VERSION)" '/DBIN_DIR=..\..\target\release' '/DRULES_DIR=..\..\rules' "/DOUT_FILE=$outFile" packaging\windows\localedr.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage unsigned release build outputs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          $stageDir = Join-Path $env:RUNNER_TEMP 'unsigned-build-outputs'
          if (Test-Path -LiteralPath $stageDir) {
            Remove-Item -LiteralPath $stageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          $filesToStage = @(
            'target\release\ledr-daemon.exe',
            'target\release\ledr-ui.exe',
            'target\release\ledr-bridge-nm.exe',
            'target\release\ledr-auth-helper.exe',
            (Join-Path (Join-Path $env:RUNNER_TEMP 'nsis-out') "LocalEDR-Setup-$($env:RELEASE_TAG)-win-x64.exe")
          )
          foreach ($srcPath in $filesToStage) {
            if (-not (Test-Path -LiteralPath $srcPath -PathType Leaf)) {
              throw "Missing expected unsigned build output: $srcPath"
            }
            Copy-Item -LiteralPath $srcPath -Destination $stageDir -Force
          }
      - name: Upload unsigned build outputs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-outputs
          path: ${{ runner.temp }}/unsigned-build-outputs/*
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [preflight, verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-build-outputs
          path: ${{ runner.temp }}/unsigned-build-outputs
      - name: Package and sign release artifacts
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
          LEDR_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.LEDR_UPDATE_SIGNING_PRIVATE_KEY }}
          LEDR_UPDATE_SIGNING_KEY_ID: ${{ secrets.LEDR_UPDATE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          BIN_STAGE="${RUNNER_TEMP}/unsigned-build-outputs"
          INSTALLER_EXE="${BIN_STAGE}/LocalEDR-Setup-${RELEASE_TAG}-win-x64.exe"
          rm -rf dist
          mkdir -p dist
          if [ "$DRY_RUN" = "true" ]; then
            # Ephemeral test keys do not match the public key ring compiled into ledr-ui above;
            # pass --key-id dry-run-test explicitly so LEDR_UPDATE_SIGNING_KEY_ID secret does not break dry-run.
            TMP_PUB="${RUNNER_TEMP}/dry-run-public-keys.json"
            TMP_PRIV="${RUNNER_TEMP}/dry-run-signing.key"
            python3 scripts/release_verify.py keygen --key-id dry-run-test --write-public-keys "$TMP_PUB" --write-private-key-file "$TMP_PRIV" >/dev/null
            python3 scripts/build_release_artifacts.py --bin-dir "$BIN_STAGE" --installer-exe "$INSTALLER_EXE" --out-dir dist --public-keys "$TMP_PUB" --key-id dry-run-test --private-key-file "$TMP_PRIV" --expect-tag "$RELEASE_TAG"
            python3 scripts/release_verify.py verify-dist --dist-dir dist --public-keys "$TMP_PUB" --expect-tag "$RELEASE_TAG"
          else
            python3 scripts/build_release_artifacts.py --bin-dir "$BIN_STAGE" --installer-exe "$INSTALLER_EXE" --out-dir dist --private-key-env LEDR_UPDATE_SIGNING_PRIVATE_KEY --expect-tag "$RELEASE_TAG"
            python3 scripts/release_verify.py verify-dist --dist-dir dist --expect-tag "$RELEASE_TAG"
          fi
      - name: Upload release distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, verify, build, package]
    if: needs.preflight.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Verify distribution artifacts before publishing
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          python3 scripts/release_verify.py verify-dist --dist-dir dist --expect-tag "$RELEASE_TAG"
      - name: Atomically create draft release, upload assets, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          if ! git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release tag '${TAG}' does not exist on origin; refusing publish." >&2
            exit 1
          fi
          TAG_COMMIT_SHA=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          if [ "$TAG_COMMIT_SHA" != "$SOURCE_SHA" ]; then
            echo "Release tag '${TAG}' points to ${TAG_COMMIT_SHA}, expected source commit ${SOURCE_SHA}." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "Release $TAG already exists and is published; refusing to overwrite." >&2
              exit 1
            fi
            existing_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            if [ -n "$existing_assets" ]; then
              while IFS= read -r name; do
                [ -z "$name" ] && continue
                gh release delete-asset "$TAG" "$name" --yes
              done <<< "$existing_assets"
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "LocalEDR $TAG" --generate-notes
          fi

          gh release upload "$TAG" \
            "dist/LocalEDR-Setup-${TAG}-win-x64.exe" \
            "dist/LocalEDR-${TAG}-win-x64.zip" \
            "dist/LocalEDR-chrome-ext-${TAG}.zip" \
            "dist/SHA256SUMS.txt" \
            --clobber

          gh release upload "$TAG" \
            "dist/update-manifest.json" \
            "dist/update-manifest.json.sig" \
            --clobber

          gh release edit "$TAG" --draft=false
