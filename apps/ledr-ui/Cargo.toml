[package]
name = "ledr-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ledr-ui"
path = "src/main.rs"

[dependencies]
ledr-proto = { workspace = true }
ledr-updater = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12", default-features = false, features = ["wry", "common-controls-v6"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "UI_Notifications",
    "Data_Xml_Dom",
    "Win32_System_Com",
] }
winreg = { workspace = true }

[build-dependencies]
tauri-build = "2.7"
